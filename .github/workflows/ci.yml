name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Cancel an in-flight run when a new commit lands on the same ref —
# the older one's results are about to be obsolete anyway. Saves the
# heavy Playwright + corpus job a lot of duplicate work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. The job only reads the source tree; no
# need for write access to contents, releases, packages, etc.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Fast first-pass — oxlint is ~50-100× the speed of ESLint and
      # catches the obvious mistakes. Running it before ESLint shaves CI
      # time on the failure path; ESLint still runs after to catch the
      # rules oxlint doesn't cover (TS-aware rules, jsx-a11y, etc.).
      - name: Lint (oxlint fast pass)
        run: pnpm lint:oxlint

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Dead-code check (knip)
        run: pnpm knip

      - name: Build (with perf budget)
        env:
          # Bumped from 130 → 160 to absorb Next 16's larger runtime
          # (turbopack + new app-router bootstrap chunks add ~40 kB
          # gzipped at the / route; baseline is 149.88 kB).
          PERF_BUDGET_KB: 160
        run: pnpm exec tsx scripts/check-perf-budget.ts

      # Cache Playwright browsers across runs (~120 MB) so most PRs
      # don't pay the ~30s download.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Serve the BUILT static site and run the corpus harness against
      # it — same code path users get from GH Pages. The CI build
      # above runs without NEXT_PUBLIC_BASE_PATH (deploy.yml is what
      # sets the production basePath), so out/ has root-relative paths
      # and we can serve it as-is.
      - name: Render corpus
        run: |
          pnpm dlx serve@14 out -l 4173 --no-clipboard > /tmp/serve.log 2>&1 &
          SERVE_PID=$!
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          if ! curl -sf http://localhost:4173/ > /dev/null; then
            echo '✗ static server never became ready — serve.log:'
            cat /tmp/serve.log
            kill $SERVE_PID 2>/dev/null || true
            exit 1
          fi
          SITE=http://localhost:4173/ pnpm exec tsx scripts/render-corpus.ts
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo '--- serve.log (corpus run failed) ---'
            cat /tmp/serve.log
          fi
          kill $SERVE_PID 2>/dev/null || true
          exit $STATUS

      # Upload the corpus screenshots so reviewers can inspect what
      # was rendered when something fails.
      - name: Upload corpus screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-screenshots
          path: docs/screenshots/corpus/
          if-no-files-found: ignore
          retention-days: 14
